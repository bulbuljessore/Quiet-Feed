<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <title>Quiet Feed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Quiet Feed</h1>
    <div class="header-right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-bn" aria-pressed="true">বাংলা</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
      <label class="switch" data-i18n-title="toggleTitle">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <div id="update-banner" class="banner" hidden>
    <div><b id="update-text"></b> <a id="update-link" href="#" target="_blank" rel="noopener" data-i18n="updGet"></a></div>
    <p class="hint" data-i18n="updHow"></p>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-kw" aria-selected="true" aria-controls="panel-kw" data-i18n="tabKw"></button>
    <button role="tab" id="tab-yt" aria-selected="false" aria-controls="panel-yt" data-i18n="tabYt"></button>
    <button role="tab" id="tab-adult" aria-selected="false" aria-controls="panel-adult" data-i18n="tabAdult"></button>
  </nav>

  <!-- Keywords -->
  <section id="panel-kw" role="tabpanel">
    <form id="kw-form" class="add-form" autocomplete="off">
      <input type="text" id="kw-input" data-i18n-ph="kwPlaceholder" maxlength="100" required>
      <button type="submit" data-i18n="add"></button>
    </form>
    <ul id="kw-list"></ul>
    <p id="kw-empty" class="empty" data-i18n="kwEmpty" hidden></p>
    <p class="hint" data-i18n="kwHint"></p>

    <h2 data-i18n="blurTitle"></h2>
    <label class="check"><input type="checkbox" id="blurAll"> <span data-i18n="blurAll"></span></label>
    <button type="button" id="blur-site" class="wide" disabled></button>
    <ul id="blur-list"></ul>
    <p class="hint" data-i18n="blurHint"></p>
  </section>

  <!-- YouTube -->
  <section id="panel-yt" role="tabpanel" hidden>
    <fieldset class="modes">
      <legend data-i18n="ytMode"></legend>
      <label><input type="radio" name="mode" value="off"> <span data-i18n="modeOff"></span></label>
      <label><input type="radio" name="mode" value="block"> <span data-i18n="modeBlock"></span></label>
      <label><input type="radio" name="mode" value="only"> <span data-i18n="modeOnly"></span></label>
    </fieldset>

    <div id="yt-presets">
      <h2 data-i18n="presetsTitle"></h2>
      <div class="chips">
        <button type="button" class="chip" data-preset="kid" data-i18n="presetKid"></button>
        <button type="button" class="chip" data-preset="school" data-i18n="presetSchool"></button>
        <button type="button" class="chip" data-preset="football" data-i18n="presetFootball"></button>
        <button type="button" class="chip" data-preset="cartoon" data-i18n="presetCartoon"></button>
        <button type="button" class="chip" data-preset="games" data-i18n="presetGames"></button>
      </div>
      <p class="hint" data-i18n="presetsHint"></p>
    </div>

    <div id="yt-only-box">
      <h2 data-i18n="allowedTitle"></h2>
      <form id="allowed-form" class="add-form" autocomplete="off">
        <input type="text" id="allowed-input" data-i18n-ph="chPlaceholder" maxlength="200" required>
        <button type="submit" data-i18n="addShort"></button>
      </form>
      <ul id="allowed-list"></ul>
      <h2 data-i18n="allowedWordsTitle"></h2>
      <form id="awords-form" class="add-form" autocomplete="off">
        <input type="text" id="awords-input" data-i18n-ph="wordPlaceholder" maxlength="80" required>
        <button type="submit" data-i18n="addShort"></button>
      </form>
      <ul id="awords-list"></ul>
      <p id="allowed-empty" class="empty warn" data-i18n="allowedEmpty" hidden></p>
      <label class="check"><input type="checkbox" id="showRelatedInOnly">
        <span data-i18n="showRelated"></span></label>
    </div>

    <div id="yt-block-box">
      <h2 data-i18n="blockedTitle"></h2>
      <form id="blocked-form" class="add-form" autocomplete="off">
        <input type="text" id="blocked-input" data-i18n-ph="chPlaceholder" maxlength="200" required>
        <button type="submit" data-i18n="block"></button>
      </form>
      <ul id="blocked-list"></ul>
      <p id="blocked-empty" class="empty" data-i18n="blockedEmpty" hidden></p>
      <h2 data-i18n="blockedWordsTitle"></h2>
      <form id="bwords-form" class="add-form" autocomplete="off">
        <input type="text" id="bwords-input" data-i18n-ph="wordPlaceholder" maxlength="80" required>
        <button type="submit" data-i18n="addShort"></button>
      </form>
      <ul id="bwords-list"></ul>
      <label class="check"><input type="checkbox" id="relatedByName">
        <span data-i18n="relatedByName"></span></label>
    </div>

    <div class="current">
      <span id="current-label"></span>
      <div class="current-actions">
        <button type="button" id="cur-block" data-i18n="curBlock" disabled></button>
        <button type="button" id="cur-allow" data-i18n="curAllow" disabled></button>
      </div>
    </div>
  </section>

  <!-- Adult content -->
  <section id="panel-adult" role="tabpanel" hidden>
    <h2 data-i18n="adultTitle"></h2>
    <label class="check"><input type="checkbox" id="adultOn"> <span data-i18n="adultOn"></span></label>
    <div id="adult-options">
      <label class="check"><input type="checkbox" id="adultSites"> <span data-i18n="adultSites"></span></label>
      <label class="check"><input type="checkbox" id="adultSafe"> <span data-i18n="adultSafe"></span></label>
      <label class="check"><input type="checkbox" id="adultReveal"> <span data-i18n="adultReveal"></span></label>
    </div>
    <p class="hint" data-i18n="adultHint"></p>
    <p class="hint" data-i18n="adultLimit"></p>
  </section>

  <footer>
    <label class="check small"><input type="checkbox" id="updateCheck"> <span data-i18n="updCheck"></span></label>
    <span id="count"></span>
    <span class="hint" data-i18n="footHint"></span>
    <span class="hint" id="ver"></span>
  </footer>

  <script src="i18n.js"></script>
  <script src="yt-presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
